
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふたりのお金管理</title>
<style>
:root {
  --main: #EEDDFF;
  --main-dark: #B98BE8;
  --main-light: #F8F3FF;
  --ink: #453654;
  --muted: #93869F;
  --white: #FFFFFF;
  --red: #E58B9C;
  --green: #65AD91;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #FAF8FC;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
header {
  background: var(--main);
  padding: 25px 20px 30px;
  border-radius: 0 0 28px 28px;
}
.header-inner, main {
  max-width: 650px;
  margin: auto;
}
.brand {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
}
header h1 { font-size: 25px; margin: 10px 0 5px; }
header p { font-size: 13px; margin: 0; opacity: .75; }
main { padding: 20px 16px 50px; }
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 18px #4B315B0B;
}
.balance-card {
  margin-top: -3px;
  text-align: center;
  background: linear-gradient(145deg, #F2E6FF, #EEDDFF);
  padding: 26px 18px;
}
.eyebrow { font-size: 12px; color: #78648B; font-weight: 700; }
.balance {
  font-size: clamp(30px, 8vw, 43px);
  font-weight: 800;
  margin: 12px 0;
  letter-spacing: -1px;
  overflow-wrap: anywhere;
}
.balance-person {
  font-size: 14px;
  font-weight: 700;
}
.sub-balance { font-size: 12px; color: #78648B; margin-top: 9px; }
.section-title {
  font-size: 16px;
  font-weight: 800;
  margin: 0 0 16px;
}
.field { margin-bottom: 15px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 7px;
}
input, select, textarea {
  width: 100%;
  border: 1px solid #E9E2EF;
  background: #FCFAFE;
  padding: 12px;
  border-radius: 11px;
  color: var(--ink);
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--main-dark);
}
textarea { resize: vertical; min-height: 65px; }
.types {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.type {
  border: 1.5px solid #EAE3F0;
  background: #FCFAFE;
  color: var(--ink);
  border-radius: 13px;
  padding: 13px 9px;
  font-size: 12px;
  line-height: 1.6;
  text-align: left;
}
.type.selected {
  border-color: var(--main-dark);
  background: #F2E8FF;
  font-weight: 800;
}
.type small { display: block; color: var(--muted); }
.primary {
  border: none;
  background: var(--main-dark);
  color: white;
  font-weight: 800;
  width: 100%;
  border-radius: 13px;
  padding: 14px;
  transition: .2s;
}
.primary:active { transform: scale(.98); }
.secondary {
  border: 1px solid #E8DDF1;
  background: white;
  color: var(--ink);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #F1EDF4;
  font-size: 13px;
}
.summary-row:last-child { border: none; }
.summary-row strong { text-align: right; }
.history-item {
  border-bottom: 1px solid #F0ECF3;
  padding: 15px 0;
}
.history-item:last-child { border: none; }
.history-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.history-name { font-size: 13px; font-weight: 800; }
.history-amount { font-weight: 800; font-size: 15px; white-space: nowrap; }
.history-meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
.history-memo { font-size: 12px; margin-top: 7px; white-space: pre-wrap; }
.delete {
  border: none;
  background: transparent;
  color: #B5A8BD;
  font-size: 11px;
  padding: 7px 0 0;
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 25px 5px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}
.tab {
  flex: 1;
  border: none;
  background: #F3EFF6;
  color: var(--muted);
  padding: 11px 5px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 700;
}
.tab.active { background: var(--main); color: var(--ink); }
.hidden { display: none; }
.note {
  background: var(--main-light);
  border-radius: 11px;
  padding: 12px;
  font-size: 11px;
  line-height: 1.7;
  color: #78648B;
  margin-bottom: 15px;
}
footer {
  text-align: center;
  color: #B4A9BC;
  font-size: 10px;
  padding: 15px;
}
@media (max-width: 380px) {
  .type { font-size: 11px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">♡ TWO PEOPLE MONEY</div>
    <h1>ふたりのお金管理</h1>
    <p>お金の貸し借りを、わかりやすく。</p>
  </div>
</header>

<main>
  <section class="card balance-card">
    <div class="eyebrow">現在の差引残高</div>
    <div class="balance" id="balance">¥0</div>
    <div class="balance-person" id="balancePerson">貸し借りはありません ✨</div>
    <div class="sub-balance" id="balanceSub">現在の取引を差し引いた金額です</div>
  </section>

  <section class="card">
    <h2 class="section-title">♡ ふたりの収支</h2>
    <div class="summary-row">
      <span id="nameAView">A</span>
      <strong id="owedA">¥0</strong>
    </div>
    <div class="summary-row">
      <span id="nameBView">B</span>
      <strong id="owedB">¥0</strong>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="add">＋ 取引登録</button>
    <button class="tab" data-tab="repay">♡ 返済する</button>
    <button class="tab" data-tab="history">履歴を見る</button>
  </div>

  <section class="card" id="addPanel">
    <h2 class="section-title">新しい取引を登録</h2>
    <div class="field">
      <label>取引の種類</label>
      <div class="types" id="types">
        <button class="type selected" data-type="aToB">
          AがBに借りた
          <small>A → B に返済</small>
        </button>
        <button class="type" data-type="bToA">
          BがAに借りた
          <small>B → A に返済</small>
        </button>
        <button class="type" data-type="aPaid">
          Aが一括で払った
          <small>Bが半分を借りた</small>
        </button>
        <button class="type" data-type="bPaid">
          Bが一括で払った
          <small>Aが半分を借りた</small>
        </button>
      </div>
    </div>
    <div class="field">
      <label id="amountLabel">借りた金額（円）</label>
      <input id="amount" type="number" min="1" step="1" placeholder="例：3000">
      <div id="amountHint" class="history-meta">実際に借りた金額を入力してください。</div>
    </div>
    <div class="field">
      <label>日付</label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <textarea id="memo" placeholder="例：ランチ代、旅行のホテル代など"></textarea>
    </div>
    <button class="primary" id="addButton">取引を登録する</button>
  </section>

  <section class="card hidden" id="repayPanel">
    <h2 class="section-title">♡ 返済を記録</h2>
    <div class="note" id="repayNote">
      返済する人と金額を入力すると、差引残高が更新されます。
    </div>
    <div class="field">
      <label>返済する人</label>
      <select id="repayer">
        <option value="A">AがBに返済する</option>
        <option value="B">BがAに返済する</option>
      </select>
    </div>
    <div class="field">
      <label>返済金額（円）</label>
      <input id="repayAmount" type="number" min="1" step="1" placeholder="例：1000">
    </div>
    <div class="field">
      <label>返済日</label>
      <input id="repayDate" type="date">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <textarea id="repayMemo" placeholder="例：現金で返済"></textarea>
    </div>
    <button class="primary" id="repayButton">返済を記録する</button>
  </section>

  <section class="card hidden" id="historyPanel">
    <h2 class="section-title">📖 取引履歴</h2>
    <div class="note">新しい取引から順番に表示されます。削除すると残高も自動で再計算されます。</div>
    <div id="historyList"></div>
  </section>

  <section class="card">
    <h2 class="section-title">⚙️ 設定</h2>
    <div class="field">
      <label>Aの名前</label>
      <input id="settingA" maxlength="20" placeholder="Aの名前">
    </div>
    <div class="field">
      <label>Bの名前</label>
      <input id="settingB" maxlength="20" placeholder="Bの名前">
    </div>
    <button class="primary" id="saveSettings">名前を保存する</button>
    <div class="history-meta" style="margin-top:12px">
      名前を変更しても、過去の取引データはそのまま残ります。
    </div>
  </section>

  <footer>ふたりのお金管理 ♡ YOUR MONEY, YOUR RECORD</footer>
</main>

<script>
const STORAGE_KEY = "two_people_money_v1";

const initialData = {
  names: { A: "A", B: "B" },
  transactions: []
};

let data;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  data = saved && saved.names && Array.isArray(saved.transactions)
    ? saved : structuredClone(initialData);
} catch {
  data = structuredClone(initialData);
}

let selectedType = "aToB";

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function yen(n) {
  return "¥" + Math.abs(n).toLocaleString("ja-JP");
}

function today() {
  const d = new Date();
  const offset = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - offset).toISOString().slice(0,10);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

// 正数：AがBに借りている
// 負数：BがAに借りている
function getBalance() {
  return data.transactions.reduce((sum, t) => sum + t.delta, 0);
}

function render() {
  const a = data.names.A;
  const b = data.names.B;
  const balance = getBalance();

  $("nameAView").textContent = a;
  $("nameBView").textContent = b;
  $("settingA").value = a;
  $("settingB").value = b;

  $("owedA").textContent = balance > 0 ? yen(balance) + " を返す" : balance < 0 ? "返済済み" : "¥0";
  $("owedB").textContent = balance < 0 ? yen(balance) + " を返す" : balance > 0 ? "返済済み" : "¥0";

  if (balance > 0) {
    $("balance").textContent = yen(balance);
    $("balancePerson").textContent = a + " が " + b + " に返す金額";
    $("balanceSub").textContent = b + " が受け取る金額";
  } else if (balance < 0) {
    $("balance").textContent = yen(balance);
    $("balancePerson").textContent = b + " が " + a + " に返す金額";
    $("balanceSub").textContent = a + " が受け取る金額";
  } else {
    $("balance").textContent = "¥0";
    $("balancePerson").textContent = "貸し借りはありません ✨";
    $("balanceSub").textContent = "ふたりの収支はぴったりです";
  }

  $("repayer").options[0].text = a + " が " + b + " に返済する";
  $("repayer").options[1].text = b + " が " + a + " に返済する";

  $("repayNote").textContent = balance > 0
    ? a + " が " + yen(balance) + " を返済できます。"
    : balance < 0
      ? b + " が " + yen(balance) + " を返済できます。"
      : "現在、返済する借金はありません。";

  renderHistory();
}

function renderHistory() {
  const list = $("historyList");
  const sorted = [...data.transactions].sort((a,b) =>
    b.created - a.created
  );

  if (!sorted.length) {
    list.innerHTML = '<div class="empty">まだ取引はありません。<br>最初の取引を登録してみましょう ♡</div>';
    return;
  }

  list.innerHTML = sorted.map(t => {
    const isRepay = t.kind === "repay";
    const title = isRepay
      ? t.delta < 0
        ? data.names.A + " が返済"
        : data.names.B + " が返済"
      : t.title;

    return `
      <div class="history-item">
        <div class="history-top">
          <div>
            <div class="history-name">${escapeHTML(title)}</div>
            <div class="history-meta">${escapeHTML(t.date)}</div>
          </div>
          <div class="history-amount">${yen(t.amount)}</div>
        </div>
        ${t.memo ? `<div class="history-memo">${escapeHTML(t.memo)}</div>` : ""}
        <button class="delete" data-delete="${escapeHTML(t.id)}">この履歴を削除</button>
      </div>
    `;
  }).join("");
}

$("types").addEventListener("click", e => {
  const btn = e.target.closest("[data-type]");
  if (!btn) return;

  selectedType = btn.dataset.type;
  document.querySelectorAll(".type").forEach(el =>
    el.classList.toggle("selected", el === btn)
  );

  const shared = selectedType === "aPaid" || selectedType === "bPaid";
  $("amountLabel").textContent = shared
    ? "一括で支払った合計金額（円）"
    : "借りた金額（円）";
  $("amountHint").textContent = shared
    ? "入力した金額の半分が相手の借金として登録されます。"
    : "実際に借りた金額を入力してください。";
});

$("addButton").addEventListener("click", () => {
  const amount = Number($("amount").value);
  const date = $("date").value;

  if (!Number.isSafeInteger(amount) || amount <= 0) {
    alert("正しい金額を入力してください。");
    return;
  }
  if (!date) {
    alert("日付を入力してください。");
    return;
  }

  const shared = selectedType === "aPaid" || selectedType === "bPaid";
  const actual = shared ? amount / 2 : amount;

  if (!Number.isSafeInteger(actual)) {
    alert("半分に分けられる偶数の金額を入力してください。");
    return;
  }

  const types = {
    aToB: { delta: actual, title: data.names.A + " が " + data.names.B + " に借りた" },
    bToA: { delta: -actual, title: data.names.B + " が " + data.names.A + " に借りた" },
    aPaid: { delta: -actual, title: data.names.A + " が一括で支払い（" + data.names.B + "が半額を借りた）" },
    bPaid: { delta: actual, title: data.names.B + " が一括で支払い（" + data.names.A + "が半額を借りた）" }
  };

  const selected = types[selectedType];

  data.transactions.push({
    id: crypto.randomUUID(),
    kind: "debt",
    amount: actual,
    delta: selected.delta,
    title: selected.title,
    date,
    memo: $("memo").value.trim(),
    created: Date.now()
  });

  save();
  $("amount").value = "";
  $("memo").value = "";
  $("date").value = today();
  render();
  alert("取引を登録しました！ ♡");
});

$("repayButton").addEventListener("click", () => {
  const amount = Number($("repayAmount").value);
  const date = $("repayDate").value;
  const repayer = $("repayer").value;
  const balance = getBalance();

  if (!Number.isSafeInteger(amount) || amount <= 0) {
    alert("正しい返済金額を入力してください。");
    return;
  }
  if (!date) {
    alert("返済日を入力してください。");
    return;
  }

  const canRepay = repayer === "A" ? balance > 0 : balance < 0;
  if (!canRepay) {
    alert("現在、その人が返済する借金はありません。");
    return;
  }

  if (amount > Math.abs(balance)) {
    alert("返済金額が現在の借金を超えています。");
    return;
  }

  const delta = repayer === "A" ? -amount : amount;

  data.transactions.push({
    id: crypto.randomUUID(),
    kind: "repay",
    amount,
    delta,
    title: data.names[repayer] + " が返済",
    date,
    memo: $("repayMemo").value.trim(),
    created: Date.now()
  });

  save();
  $("repayAmount").value = "";
  $("repayMemo").value = "";
  $("repayDate").value = today();
  render();
  alert("返済を記録しました！ ✨");
});

$("historyList").addEventListener("click", e => {
  const btn = e.target.closest("[data-delete]");
  if (!btn) return;

  if (!confirm("この取引履歴を削除しますか？\n残高も再計算されます。")) return;

  data.transactions = data.transactions.filter(t => t.id !== btn.dataset.delete);
  save();
  render();
});

$("saveSettings").addEventListener("click", () => {
  const a = $("settingA").value.trim();
  const b = $("settingB").value.trim();

  if (!a || !b) {
    alert("ふたりの名前を入力してください。");
    return;
  }
  if (a === b) {
    alert("別々の名前を設定してください。");
    return;
  }

  data.names = { A: a, B: b };
  data.transactions = data.transactions.map(t => ({
    ...t,
    title: t.kind === "repay"
      ? (t.delta < 0 ? a : b) + " が返済"
      : t.kind === "debt"
        ? t.title.replaceAll("A", a).replaceAll("B", b)
        : t.title
  }));
  save();
  render();
  alert("名前を保存しました！");
});

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t === btn)
    );
    ["add", "repay", "history"].forEach(name =>
      $(name + "Panel").classList.toggle("hidden", name !== btn.dataset.tab)
    );
  });
});

$("date").value = today();
$("repayDate").value = today();
render();
</script>
</body>
</html>
